<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a card table set out like a departures hall: rivals across the top, a split-flap
   board through the middle, your table above a fanned hand docked at the bottom. */
:root {
  --hall: #E5EAEE;
  --hall-2: #D6DEE4;
  --zone: #D8E0E6;
  --zone-line: #C2CDD5;
  --ink: #142029;
  --ink-soft: #4F5E6A;
  --sheet: #F6F8F9;
  --sheet-line: #D3DBE1;
  --board: #10171D;
  --board-ink: #FFB61E;
  --board-ink-2: #C99A3E;
  --accent: #FFB61E;
  --accent-ink: #1E1400;
  --warn: #B3261E;
  --hot: #D6332B;
  --focus: #1C62D9;
  --card: #FCFBF8;
  --card-ink: #16212B;
  --card-soft: #5E6B75;
  --card-line: #D6DCE0;
  --shadow: 0 1px 2px rgba(17, 28, 37, .2), 0 6px 14px rgba(17, 28, 37, .12);
  --shadow-lift: 0 4px 10px rgba(17, 28, 37, .22), 0 18px 34px rgba(17, 28, 37, .2);
  --scrim: rgba(12, 18, 24, .45);
  --sky-line: rgba(20, 32, 41, .16);

  --c-brown: #8A5A35;  --t-brown: #FFFFFF;
  --c-lblue: #86CDEF;  --t-lblue: #10293A;
  --c-pink: #D5418F;   --t-pink: #FFFFFF;
  --c-orange: #EE8424; --t-orange: #2A1400;
  --c-red: #D8352F;    --t-red: #FFFFFF;
  --c-yellow: #F3C334; --t-yellow: #2B2100;
  --c-green: #1E9455;  --t-green: #FFFFFF;
  --c-dblue: #2340A0;  --t-dblue: #FFFFFF;
  --c-rail: #24282C;   --t-rail: #FFFFFF;
  --c-util: #A6D8BE;   --t-util: #0F2A1E;

  --m-1: #E9E0C9; --m-2: #F2BBC9; --m-3: #C3E4B6; --m-4: #AACFEC; --m-5: #CDB6E8; --m-10: #F6B872;
  --seat-0: #138290; --seat-1: #9B3F8F; --seat-2: #B07A00; --seat-3: #4A6684;

  --f-display: "Big Shoulders Display", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", "Liberation Sans Narrow", "DejaVu Sans Condensed", sans-serif;
  --f-label: "Big Shoulders Text", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", "Liberation Sans Narrow", "DejaVu Sans Condensed", sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --dockh: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --hall: #0C1318; --hall-2: #111B22; --zone: #141E26; --zone-line: #22313C; --ink: #E4EBF0; --ink-soft: #93A3AF;
    --sheet: #16212A; --sheet-line: #2A3945; --board: #04080B; --board-ink: #FFB61E; --board-ink-2: #B58A35;
    --focus: #79A8FF; --warn: #FF8A80; --hot: #FF6B5E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 18px rgba(0, 0, 0, .35); --shadow-lift: 0 6px 14px rgba(0, 0, 0, .5), 0 22px 40px rgba(0, 0, 0, .45);
    --scrim: rgba(0, 0, 0, .6); --sky-line: rgba(255, 182, 30, .14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --hall: #0C1318; --hall-2: #111B22; --zone: #141E26; --zone-line: #22313C; --ink: #E4EBF0; --ink-soft: #93A3AF;
  --sheet: #16212A; --sheet-line: #2A3945; --board: #04080B; --board-ink: #FFB61E; --board-ink-2: #B58A35;
  --focus: #79A8FF; --warn: #FF8A80; --hot: #FF6B5E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 18px rgba(0, 0, 0, .35); --shadow-lift: 0 6px 14px rgba(0, 0, 0, .5), 0 22px 40px rgba(0, 0, 0, .45);
  --scrim: rgba(0, 0, 0, .6); --sky-line: rgba(255, 182, 30, .14);
  color-scheme: dark;
}

html, body { min-height: 100%; }
body { background: var(--hall); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
#app { position: relative; z-index: 1; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 0; }

/* ---------- the sky behind everything ---------- */
#sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; color: var(--sky-line); }
#sky svg { width: 100%; height: 100%; }
#sky .route { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 3 7; }
#sky .jet { fill: currentColor; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--zone-line); background: var(--sheet); color: var(--ink);
  font-weight: 600; font-size: 15px; text-align: center;
  transition: transform .12s ease, filter .12s ease, border-color .12s ease, box-shadow .2s ease;
}
.btn:hover:not(:disabled) { border-color: var(--ink-soft); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 6px 16px rgba(255, 182, 30, .28); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.05); border-color: var(--accent); }
.btn.dark { background: var(--board); color: var(--board-ink); border-color: var(--board); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); }
.btn.block { width: 100%; }
.btn.big { min-height: 56px; font-size: 17px; }
.btn:disabled { opacity: .45; box-shadow: none; }
.btn.pulse { animation: pulse 1.6s ease-in-out infinite; }
.btn.no-btn { background: var(--hot); border-color: var(--hot); color: #FFFFFF; box-shadow: 0 6px 16px rgba(214, 51, 43, .3); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 182, 30, .6); } 50% { box-shadow: 0 0 0 9px rgba(255, 182, 30, 0); } }
.linkbtn { background: none; border: 0; padding: 6px 2px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.linkbtn.on-dark { color: var(--board-ink); }
.iconbtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--zone-line); background: var(--sheet); color: var(--ink); padding: 0; transition: transform .12s ease; }
.iconbtn:active { transform: scale(.94); }
.iconbtn svg { width: 20px; height: 20px; }

/* ---------- split-flap ---------- */
.flaps { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.flaps .gap { width: 14px; }
.tile {
  position: relative; display: inline-grid; place-items: center;
  width: 1.05em; height: 1.4em; border-radius: .09em;
  background: var(--board); color: var(--board-ink);
  font-family: var(--f-display); font-weight: 900; line-height: 1;
  box-shadow: inset 0 -2px 0 rgba(255, 255, 255, .04), 0 2px 6px rgba(0, 0, 0, .25);
  animation: flapin .55s cubic-bezier(.3, 1.4, .5, 1) both;
}
.tile::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(0, 0, 0, .55); }
@keyframes flapin { 0% { transform: perspective(300px) rotateX(-90deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }

/* ---------- home ---------- */
.home { display: grid; gap: 26px; padding-block: 18px 48px; max-width: 520px; margin: 0 auto; }
.home .flaps { font-size: clamp(36px, 12vw, 70px); flex-wrap: nowrap; }
.home .tagline { text-align: center; color: var(--ink-soft); font-size: 16px; max-width: 34ch; margin: 0 auto; animation: rise .6s .45s ease both; }
.fan { position: relative; height: 172px; display: flex; justify-content: center; align-items: flex-end; }
.fan-slot { position: absolute; bottom: 0; left: 50%; margin-left: -52px; transform-origin: 50% 120%;
  transform: translateX(calc(var(--x) * min(11vw, 50px))) translateY(var(--y)) rotate(var(--r));
  animation: fanin .7s cubic-bezier(.2, 1.2, .4, 1) both; }
.fan-slot:hover { translate: 0 -10px; transition: translate .2s ease; }
@keyframes fanin { from { transform: translateX(0) translateY(160px) rotate(0deg); opacity: 0; } }
.choices { display: grid; gap: 12px; animation: rise .6s .7s ease both; }
.choice { display: grid; gap: 4px; }
.choice small { color: var(--ink-soft); font-size: 13px; text-align: center; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.home-foot { display: flex; justify-content: center; gap: 18px; }
.departures { background: var(--board); color: var(--board-ink); border-radius: 14px; padding: 12px 14px; font-family: var(--f-label); box-shadow: var(--shadow); }
.departures h3 { display: flex; justify-content: space-between; font: 800 13px/1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--board-ink-2); margin-bottom: 8px; }
.dep-row { display: grid; grid-template-columns: 20px 1fr auto auto; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid rgba(255, 255, 255, .07); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; animation: rowflip .5s ease both; transform-origin: 50% 0; }
.dep-row i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; background: var(--pc); color: var(--pt); }
.dep-row i svg { width: 14px; height: 14px; }
.dep-row span:nth-child(3), .dep-row span:nth-child(4) { font-variant-numeric: tabular-nums; color: var(--board-ink-2); }
@keyframes rowflip { from { transform: perspective(400px) rotateX(-80deg); opacity: 0; } to { transform: none; opacity: 1; } }
.scores { background: var(--sheet); border: 1px solid var(--sheet-line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.scores h3 { font: 800 13px/1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.score-row { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; font-family: var(--f-label); }
.score-row span { display: inline-flex; align-items: baseline; gap: 8px; }
.score-row b { font-weight: 800; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }
.score-row em { font: 900 26px/1 var(--f-display); font-style: normal; color: var(--accent); font-variant-numeric: tabular-nums; }
.score-row i { color: var(--ink-soft); font-style: normal; }
.score-row.big em { font-size: 34px; }
.win-card .score-row b { color: #F1E2C0; }

/* ---------- forms ---------- */
.panel { background: var(--sheet); border: 1px solid var(--sheet-line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.field { display: flex; align-items: center; gap: 10px; }
.field input {
  flex: 1; min-width: 0; min-height: 46px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--zone-line); background: var(--hall); color: var(--ink); font: 500 16px var(--f-body);
}
.field input::placeholder { color: var(--ink-soft); }
.fixed-name { font: 800 18px/1 var(--f-label); letter-spacing: .04em; text-transform: uppercase; }
.screen-title { font: 900 clamp(30px, 8vw, 44px)/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.lede { color: var(--ink-soft); }
.stack { display: grid; gap: 14px; }
.stack.narrow { max-width: 520px; margin: 0 auto; padding-block: 8px 40px; animation: rise .4s ease both; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 auto; }
.note { font-size: 13px; color: var(--ink-soft); }
.callout { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--zone); border-radius: 0 10px 10px 0; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.callout.warn { border-left-color: var(--warn); }
.seatlist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.seatlist li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--zone); font-weight: 600; animation: rise .4s ease both; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--zone-line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.dots { display: inline-flex; gap: 3px; align-items: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dot 1.1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-4px); opacity: 1; } }

/* ---------- avatars & pills ---------- */
.avatar { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--pc); color: #FFFFFF; font: 800 15px/1 var(--f-label); flex: none; box-shadow: 0 0 0 2px var(--hall), 0 0 0 3px var(--pc); }
.avatar.bot svg { width: 17px; height: 17px; transform: rotate(45deg); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--hall); border: 1px solid var(--zone-line); font: 700 14px/1 var(--f-label); letter-spacing: .03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill svg { width: 14px; height: 14px; }
button.pill:hover { border-color: var(--ink-soft); }
.bankpill { font-size: 15px; }
.turn-tag { font: 800 12px/1 var(--f-label); letter-spacing: .12em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 4px 7px; border-radius: 6px; animation: tagpop .4s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes tagpop { from { transform: scale(.4); opacity: 0; } }

/* ---------- game layout ---------- */
.game { display: flex; flex-direction: column; gap: 10px; padding-bottom: calc(var(--dockh) + 16px); min-height: calc(100dvh - 28px - var(--dockh)); }
.game > * { flex: none; }
/* Your table takes whatever height is left, so there's no dead gap above your hand. */
.game > .zone.mine { flex: 1 1 auto; align-content: start; }
.topbar { position: relative; display: flex; align-items: center; gap: 8px; }
.topbar .wm { font: 900 22px/1 var(--f-display); letter-spacing: .08em; }
.topbar .mode { font: 700 12px/1 var(--f-label); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.spacer { flex: 1; }
.rivals { display: grid; gap: 10px; }

@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.zone { position: relative; background: var(--zone); border: 1px solid var(--zone-line); border-radius: 16px; padding: 10px; display: grid; gap: 8px; min-width: 0; transition: box-shadow .3s ease; }
.zone.is-turn {
  border: 2px solid transparent; padding: 9px;
  background: linear-gradient(var(--zone), var(--zone)) padding-box,
    conic-gradient(from var(--ang), var(--accent), rgba(255, 182, 30, .08) 25%, var(--accent) 50%, rgba(255, 182, 30, .08) 75%, var(--accent)) border-box;
  animation: orbit 3.5s linear infinite;
  box-shadow: 0 0 22px rgba(255, 182, 30, .18);
}
@keyframes orbit { to { --ang: 360deg; } }
.zone.drop-ok { box-shadow: 0 0 0 3px rgba(255, 182, 30, .45); }
.zone.drop-hover { box-shadow: 0 0 0 4px var(--accent), 0 0 28px rgba(255, 182, 30, .45); }
.zone-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.pname { font: 800 18px/1 var(--f-label); letter-spacing: .03em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12ch; }
.setpips { display: inline-flex; gap: 4px; align-items: center; }
.setpips i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-soft); transition: background .3s ease, transform .3s ease; }
.setpips i.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(255, 182, 30, .6); }
.backs { display: inline-flex; align-items: center; }
.backs i { width: 11px; height: 16px; border-radius: 2px; background: var(--board); border: 1px solid var(--board-ink-2); margin-left: -6px; }
.backs i:first-child { margin-left: 0; }
.piles { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; min-height: 36px; }
.empty { color: var(--ink-soft); font-size: 13px; padding: 8px 2px; }

/* 3 or 4 players: rivals on one line each, sets as chips */
.rivals.many { gap: 8px; }
.zone.compact { padding: 8px 10px; gap: 6px; border-radius: 14px; }
.zone.compact.is-turn { padding: 7px 9px; }
.zone.compact .zone-head { flex-wrap: nowrap; gap: 6px; }
.zone.compact .avatar { width: 26px; height: 26px; font-size: 13px; }
.zone.compact .avatar.bot svg { width: 14px; height: 14px; }
.zone.compact .pname { font-size: 15px; max-width: none; flex: 0 1 auto; min-width: 0; }
.zone.compact .zone-head > :not(.pname):not(.spacer) { flex: none; }
.zone.compact .turn-tag { font-size: 10px; padding: 3px 5px; }
.zone.compact .pill { height: 26px; padding: 0 8px; font-size: 13px; gap: 4px; }
.zone.compact .setpips i { width: 8px; height: 8px; }
.zone.compact .empty { padding: 0 2px; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 0; }
.chip-btn { padding: 0; border: 0; background: none; border-radius: 8px; transition: transform .15s ease; }
.chip-btn:hover { transform: translateY(-2px); }
.chip { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 7px; border-radius: 8px; background: var(--pc); color: var(--pt); font: 800 12px/1 var(--f-label); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.chip .ph { width: 13px; height: 13px; flex: none; }
.chip b { font-weight: 800; display: inline-flex; }
.chip svg { width: 12px; height: 12px; flex: none; }
.chip.full { box-shadow: 0 0 0 2px var(--accent), 0 0 10px rgba(255, 182, 30, .45); }
.chip.burst { animation: burst 1.2s ease; }
.chip .mark { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }

.pile-btn { padding: 0; border: 0; background: none; border-radius: 9px; transition: transform .15s ease; }
.pile-btn:hover { transform: translateY(-2px); }
.pile {
  position: relative; width: 88px; padding: 0; border-radius: 9px; overflow: hidden; text-align: left;
  background: var(--card); color: var(--card-ink); border: 1px solid var(--card-line); box-shadow: var(--shadow);
  display: flex; flex-direction: column; font-family: var(--f-label);
}
.pile.full { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.pile.burst { animation: burst 1.2s ease; }
.pile.burst::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .85) 50%, transparent 70%); background-size: 250% 100%; animation: sheen-once 1s ease; pointer-events: none; }
@keyframes burst { 0% { transform: scale(1); } 25% { transform: scale(1.12) rotate(-2deg); } 50% { transform: scale(.98) rotate(1deg); } 100% { transform: none; } }
@keyframes sheen-once { from { background-position: 120% 0; } to { background-position: -40% 0; } }
.pile-head { display: flex; align-items: center; gap: 4px; padding: 4px 6px; background: var(--pc); color: var(--pt); font: 800 11px/1.1 var(--f-label); letter-spacing: .08em; text-transform: uppercase; }
.pile-head .ph { width: 12px; height: 12px; flex: none; }
.pile-head .pile-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pile-rows { display: flex; flex-direction: column; }
.prow { display: flex; align-items: center; gap: 5px; padding: 3px 6px; border-top: 1px solid var(--card-line); font: 700 12px/1.15 var(--f-label); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow:first-child { border-top: 0; }
.sw { width: 9px; height: 9px; border-radius: 2px; flex: none; background: var(--pc); }
.sw.split { background: linear-gradient(135deg, var(--pa) 50%, var(--pb) 50%); }
.sw.any { background: conic-gradient(var(--c-brown), var(--c-lblue), var(--c-pink), var(--c-orange), var(--c-red), var(--c-yellow), var(--c-green), var(--c-dblue), var(--c-rail), var(--c-util), var(--c-brown)); }
.pile-foot { display: flex; align-items: center; gap: 3px; padding: 3px 6px 4px; border-top: 1px solid var(--card-line); font: 700 12px/1.1 var(--f-label); color: var(--card-soft); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.pile-foot svg { width: 13px; height: 13px; flex: none; display: block; }
.bld { display: inline-flex; }
.bld-house { color: #1E8B4C; }
.bld-hotel { color: #C0322C; }

.strip { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.deck, .discardslot { position: relative; padding: 0; border: 0; background: none; width: 52px; height: 73px; }
.deck .card { position: absolute; inset: 0; }
.deck .card:nth-child(1) { transform: translate(3px, 3px); }
.deck .card:nth-child(2) { transform: translate(1.5px, 1.5px); }
.deck-n { position: absolute; right: -6px; bottom: -6px; z-index: 2; background: var(--accent); color: var(--accent-ink); font: 800 13px/1 var(--f-label); padding: 4px 6px; border-radius: 7px; font-variant-numeric: tabular-nums; }
.discard-top { display: block; }
.slot-empty { display: grid; place-items: center; width: 100%; height: 100%; border: 1.5px dashed var(--zone-line); border-radius: 6px; font: 700 10px/1 var(--f-label); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
.flap { position: relative; overflow: hidden; background: var(--board); color: var(--board-ink); border-radius: 14px; padding: 10px 14px; min-height: 76px; display: grid; align-content: center; gap: 6px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), var(--shadow); transition: box-shadow .2s ease; }
.flap.drop-ok { box-shadow: 0 0 0 3px rgba(255, 182, 30, .5), var(--shadow); }
.flap.drop-hover { box-shadow: 0 0 0 4px var(--accent), 0 0 30px rgba(255, 182, 30, .5); }
.flap-main { display: flex; flex-wrap: nowrap; gap: 2px; overflow: hidden; }
.fc { position: relative; display: inline-grid; place-items: center; min-width: .66em; height: 1.18em; padding: 0 .04em; border-radius: 3px; background: rgba(255, 255, 255, .055); font: 900 clamp(20px, 6vw, 28px)/1 var(--f-display); letter-spacing: 0; text-transform: uppercase; }
.fc::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, .75); }
.fc.fc-flip { animation: fcflip .16s ease-out; }
@keyframes fcflip { from { transform: perspective(120px) rotateX(-75deg); } to { transform: none; } }
.flap-sub { display: flex; align-items: center; gap: 8px; font: 700 13px/1.15 var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: var(--board-ink-2); }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; transition: background .25s ease; }
.pips i.on { background: currentColor; }

/* ---------- your hand ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding: 8px 16px calc(6px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--hall) 72%, rgba(0, 0, 0, 0));
  display: grid; gap: 4px; justify-items: center;
}
.dock > * { width: 100%; max-width: 828px; }
.dock-bar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.dock-label { font: 800 14px/1 var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.dock-bar .pips { color: var(--ink); }
.fan-hand { position: relative; touch-action: none; }
.hand-card {
  position: absolute; left: 50%; bottom: 14px; padding: 0; border: 0; background: none; border-radius: 10px;
  width: var(--hand-cw); height: calc(var(--hand-cw) * 1.4);
  transform: translateX(calc(-50% + var(--fx))) translateY(var(--fy)) rotate(var(--fr));
  transform-origin: 50% 115%;
  transition: transform .26s cubic-bezier(.3, 1.3, .5, 1), filter .2s ease;
  touch-action: none;
}
.hand-card:hover { transform: translateX(calc(-50% + var(--fx))) translateY(calc(var(--fy) - 12px)) rotate(var(--fr)); }
.hand-card.sel { transform: translateX(calc(-50% + var(--fx))) translateY(calc(var(--fy) - 34px)) rotate(0deg) scale(1.07); }
.hand-card.sel .card { box-shadow: 0 0 0 2px var(--accent), var(--shadow-lift); }
.hand-card.hint .card { box-shadow: 0 0 0 2px rgba(255, 182, 30, .9), 0 0 18px rgba(255, 182, 30, .45), var(--shadow); }
.hand-card.fresh .card { animation: fresh 1.6s ease 2; }
@keyframes fresh { 50% { box-shadow: 0 0 0 3px var(--accent), 0 0 24px rgba(255, 182, 30, .6), var(--shadow); } }
.hand-card.dragging { opacity: .25; }
.hint-badge { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); white-space: nowrap; background: var(--accent); color: var(--accent-ink); font: 800 10px/1 var(--f-label); letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); }
.quickbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; padding: 6px; border-radius: 14px; background: var(--board); box-shadow: var(--shadow-lift); animation: qbin .22s cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes qbin { from { transform: translateY(10px) scale(.96); opacity: 0; } }
.qbtn { min-height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .06); color: #EEF2F5; font: 700 14px/1 var(--f-body); }
.qbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.qbtn.ghost { background: transparent; }
.qbtn.x { width: 38px; padding: 0; font-size: 20px; }
.qbtn:disabled { opacity: .4; }
.qnote { color: var(--board-ink-2); font: 700 13px/1.2 var(--f-label); letter-spacing: .06em; text-transform: uppercase; padding: 0 6px; }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .35)); transition: none; }
.drag-ghost .card { --cw: var(--hand-cw, 90px); }
.droppads { position: fixed; left: 50%; bottom: calc(var(--dockh) + 10px); transform: translateX(-50%); z-index: 45; display: flex; gap: 8px; width: min(560px, calc(100vw - 32px)); animation: qbin .2s ease both; }
.pad { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 58px; border-radius: 14px; border: 2px dashed var(--zone-line); background: var(--sheet); color: var(--ink-soft); font: 800 14px/1 var(--f-label); letter-spacing: .08em; text-transform: uppercase; transition: transform .15s ease, background .15s ease; }
.pad svg { width: 16px; height: 16px; }
.pad.ok { border-color: var(--accent); color: var(--ink); }
.pad.no { opacity: .35; }
.pad.drop-hover { background: var(--accent); color: var(--accent-ink); border-style: solid; transform: scale(1.05); }
.watching { justify-content: center; }

/* ---------- cards ---------- */
.card {
  --cw: 88px;
  position: relative; display: flex; flex-direction: column; flex: none;
  width: var(--cw); height: calc(var(--cw) * 1.4);
  border-radius: calc(var(--cw) * .085); overflow: hidden;
  background: var(--card); color: var(--card-ink); border: 1px solid var(--card-line); box-shadow: var(--shadow);
  font-family: var(--f-body); font-size: calc(var(--cw) / 8); line-height: 1.15; text-align: left;
  user-select: none; -webkit-user-select: none;
}
.card.sz-hand { --cw: var(--hand-cw, 90px); }
.card.sz-big { --cw: 156px; }
.card.sz-mid { --cw: 104px; }
.card.sz-fly { --cw: 88px; }
.card.sz-mini { --cw: 64px; }
.card.sz-tiny { --cw: 52px; }
.card .val {
  position: absolute; top: .35em; right: .35em; z-index: 2;
  min-width: 2.4em; height: 2.2em; padding: 0 .35em; border-radius: 1.1em;
  display: grid; place-items: center; background: var(--card); color: var(--card-ink);
  font: 800 .72em/1 var(--f-label); letter-spacing: .02em; box-shadow: 0 0 0 1px rgba(0, 0, 0, .14);
  font-variant-numeric: tabular-nums;
}
.card .kind { margin-top: auto; padding: .35em .5em .45em; font: 800 .68em/1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--card-soft); }
.card.prop .band { position: relative; z-index: 1; background: var(--pc); color: var(--pt); padding: .5em; min-height: 3.7em; display: flex; flex-direction: column; }
.card .region { font: 800 .72em/1 var(--f-label); letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
.card.prop .region { padding-right: 3.2em; }
.card .city { font: 800 1.28em/1 var(--f-label); text-transform: uppercase; letter-spacing: .01em; margin-top: .6em; overflow-wrap: anywhere; hyphens: auto; }
.card .city.long { font-size: 1.08em; }
.card .wm { position: absolute; right: .35em; bottom: .35em; width: 3.4em; height: 3.4em; color: var(--pc); opacity: .16; }
.ladder { position: relative; z-index: 1; list-style: none; margin: 0; padding: .45em .5em 0; display: grid; gap: .22em; }
.ladder li { display: flex; align-items: center; gap: .4em; font: 700 .78em/1.1 var(--f-label); letter-spacing: .03em; color: var(--card-soft); font-variant-numeric: tabular-nums; }
.ladder li b { display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: .3em; background: var(--pc); color: var(--pt); font-weight: 800; }
.ladder li span { margin-left: auto; color: var(--card-ink); font-weight: 800; }
.ladder li.full span::after { content: " \2605"; color: #C78A00; }

.card.money { background: var(--note); }
.card.money .note-face { position: relative; margin: .45em; flex: 1; border: 1px solid rgba(0, 0, 0, .18); border-radius: .5em; display: grid; place-items: center; align-content: center; gap: .3em;
  background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .35) 0 18%, transparent 19%), repeating-radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .22) 0 .18em, transparent .18em .42em); }
.card.money .note-val { font: 900 2.7em/1 var(--f-display); letter-spacing: .01em; color: var(--card-ink); }
.card.money .note-val.wide { font-size: 2.2em; }
.card.money .note-cap { font: 800 .6em/1 var(--f-label); letter-spacing: .18em; text-transform: uppercase; color: rgba(0, 0, 0, .55); }
.card.money .note-corner { position: absolute; top: .3em; left: .4em; font: 900 .9em/1 var(--f-display); color: rgba(0, 0, 0, .5); }
.card.money .note-corner.b { top: auto; left: auto; bottom: .3em; right: .4em; transform: rotate(180deg); }

.card.action, .card.rent { background: var(--card); }
.stamp {
  margin: 2.1em auto 0; width: 6.1em; height: 6.1em; border-radius: 50%;
  display: grid; place-items: center; text-align: center; color: var(--ink-a, #1F2A33);
  border: .2em solid currentColor; box-shadow: inset 0 0 0 .22em var(--card), inset 0 0 0 .33em currentColor;
  transform: rotate(-9deg);
}
.stamp span { font: 900 1.12em/.95 var(--f-display); letter-spacing: .02em; text-transform: uppercase; padding: 0 .35em; max-width: 100%; overflow-wrap: anywhere; }
.stamp span.long { font-size: .98em; }
.card.action .kind { text-align: center; }
.a-dealbreaker { --ink-a: #5B2A86; } .a-jsn { --ink-a: #B3261E; } .a-sly { --ink-a: #0E7C7B; } .a-forced { --ink-a: #2E4A9E; }
.a-debt { --ink-a: #7A4B12; } .a-birthday { --ink-a: #B0307A; } .a-passgo { --ink-a: #1F7A3D; } .a-house { --ink-a: #1F7A3D; }
.a-hotel { --ink-a: #B3261E; } .a-double { --ink-a: #C25E00; }

.rent-disc { margin: 2.1em auto 0; width: 6.1em; height: 6.1em; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: linear-gradient(90deg, var(--pa) 50%, var(--pb) 50%); box-shadow: inset 0 0 0 .25em rgba(255, 255, 255, .55), 0 0 0 1px rgba(0, 0, 0, .15); }
.rent-disc.any { background: conic-gradient(var(--c-brown), var(--c-lblue), var(--c-pink), var(--c-orange), var(--c-red), var(--c-yellow), var(--c-green), var(--c-dblue), var(--c-rail), var(--c-util), var(--c-brown)); }
.rent-disc span { background: var(--card); color: var(--card-ink); font: 900 1.05em/1 var(--f-display); letter-spacing: .08em; padding: .3em .45em; border-radius: .35em; text-transform: uppercase; }
.card.rent .kind { text-align: center; line-height: 1.25; }

.card.wild .half { position: relative; background: var(--hc); color: var(--ht); padding: .4em .5em; min-height: 3.6em; display: flex; flex-direction: column; gap: .15em; overflow: hidden; }
.card.wild .half.a { padding-right: 2.3em; }
.card.wild .half.b { transform: rotate(180deg); }
.card.wild .half .hi { position: absolute; right: .3em; bottom: .25em; width: 1.8em; height: 1.8em; opacity: .35; }
.card.wild .wild-mid { flex: 1; display: grid; place-items: center; align-content: center; gap: .1em; font: 900 1.25em/1 var(--f-display); letter-spacing: .1em; color: var(--card-ink); text-transform: uppercase; }
.card.wild .wild-mid small { font: 800 .48em/1 var(--f-label); letter-spacing: .14em; color: var(--card-soft); }
.card.wild .mini-ladder { font: 700 .72em/1 var(--f-label); letter-spacing: .06em; opacity: .9; font-variant-numeric: tabular-nums; }
.card.wild.any { background: repeating-linear-gradient(180deg,
  var(--c-brown) 0 10%, var(--c-lblue) 10% 20%, var(--c-pink) 20% 30%, var(--c-orange) 30% 40%, var(--c-red) 40% 50%,
  var(--c-yellow) 50% 60%, var(--c-green) 60% 70%, var(--c-dblue) 70% 80%, var(--c-rail) 80% 90%, var(--c-util) 90% 100%); }
.card.wild.any .any-face { margin: auto .55em; background: var(--card); border-radius: .5em; padding: .7em .3em; text-align: center; display: grid; gap: .3em; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.card.wild.any .any-face b { font: 900 1.3em/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; }
.card.wild.any .any-face span { font: 800 .62em/1.15 var(--f-label); letter-spacing: .12em; text-transform: uppercase; color: var(--card-soft); }
.card.foil::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .55) 47%, rgba(255, 236, 170, .35) 52%, transparent 62%);
  background-size: 300% 100%; background-position: 140% 0; animation: sheen 6s ease-in-out infinite; mix-blend-mode: soft-light; }
@keyframes sheen { 0%, 62% { background-position: 140% 0; } 100% { background-position: -60% 0; } }

.card.back { background: var(--board); border-color: #2A3640;
  background-image: repeating-linear-gradient(45deg, rgba(255, 182, 30, .09) 0 2px, transparent 2px 9px), repeating-linear-gradient(-45deg, rgba(255, 182, 30, .09) 0 2px, transparent 2px 9px); }
.card.back .mono { margin: auto; width: 4.2em; height: 4.2em; border-radius: 50%; border: .16em solid var(--board-ink); color: var(--board-ink); display: grid; place-items: center; font: 900 1.3em/1 var(--f-display); letter-spacing: .04em; background: var(--board); }

.card.prop.sz-mini .band, .card.prop.sz-tiny .band { flex: 1; }
.card.sz-tiny .region, .card.sz-mini .ladder, .card.sz-tiny .ladder, .card.sz-mini .kind, .card.sz-tiny .kind, .card.sz-tiny .mini-ladder, .card.sz-tiny .wild-mid small { display: none; }
.card.sz-mini .wm, .card.sz-tiny .wm { z-index: 2; color: var(--pt); opacity: .3; }
.card.sz-mini .stamp, .card.sz-mini .rent-disc { margin-top: 2.6em; }
.card.sz-tiny .stamp, .card.sz-tiny .rent-disc { margin-top: 2.4em; }
.card.sz-tiny .any-face span, .card.sz-mini .any-face span { display: none; }

/* ---------- motion layer ---------- */
#fx { position: fixed; inset: 0; z-index: 28; pointer-events: none; }
.flyer { position: fixed; left: 0; top: 0; width: 88px; height: 123.2px; perspective: 700px; will-change: transform; }
.flyer.spot { z-index: 3; filter: drop-shadow(0 22px 30px rgba(0, 0, 0, .45)); }
.flyer-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
.fside { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.fside.rear { transform: rotateY(180deg); }
.fside > .card { box-shadow: 0 10px 22px rgba(0, 0, 0, .3); }
.spot-scrim { position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(8, 12, 16, .35), rgba(8, 12, 16, .72)); }
.spot-scrim.hot { background: radial-gradient(circle at 50% 40%, rgba(60, 8, 6, .35), rgba(40, 6, 4, .78)); }
.spot-cap { position: fixed; left: 50%; z-index: 4; width: min(460px, calc(100vw - 32px)); text-align: center; color: #F4F6F8; font: 600 17px/1.35 var(--f-body); text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
.spot-cap .chip.plain { background: rgba(255, 255, 255, .16); color: #FFFFFF; }
.ring { position: fixed; z-index: 2; width: 220px; height: 220px; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 0 30px rgba(255, 182, 30, .6); }
.ring.no { border-color: var(--hot); box-shadow: 0 0 30px rgba(214, 51, 43, .7); }
.stamp-text { position: fixed; z-index: 5; padding: .08em .3em; border: 6px solid currentColor; border-radius: 12px; font: 900 64px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--hot); background: rgba(255, 255, 255, .9); box-shadow: 0 10px 30px rgba(0, 0, 0, .3); white-space: nowrap; }
.stamp-text.blocked { color: var(--hot); font-size: 48px; }
.plane-fly { position: fixed; left: 0; top: 0; z-index: 6; width: 28px; height: 28px; color: var(--accent); filter: drop-shadow(0 0 8px rgba(255, 182, 30, .7)); }
.plane-fly svg { width: 100%; height: 100%; }
.float-txt { position: fixed; z-index: 7; font: 900 22px/1 var(--f-display); letter-spacing: .02em; color: #1E9455; text-shadow: 0 2px 0 var(--hall), 0 0 12px rgba(0, 0, 0, .2); white-space: nowrap; }
.float-txt.loss { color: var(--hot); }
.ribbon { position: fixed; z-index: 7; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--pc); color: var(--pt); font: 900 15px/1 var(--f-label); letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 0 0 2px var(--accent), 0 10px 24px rgba(0, 0, 0, .3); white-space: nowrap; }
.ribbon svg { width: 16px; height: 16px; }
.react-pop { position: fixed; z-index: 8; font-size: 46px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .3)); }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 45; pointer-events: none; }
.landing { visibility: hidden; }

/* ---------- sheets ---------- */
#sheet-root { position: relative; z-index: 30; }
.sheet-backdrop { position: fixed; inset: 0; background: var(--scrim); }
.sheet-backdrop.enter { animation: fade .2s ease both; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; max-height: 88dvh;
  display: flex; flex-direction: column; background: var(--sheet); color: var(--ink);
  border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, .25);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--sheet-line); margin: 8px auto 0; }
.sheet.hot { box-shadow: 0 -8px 30px rgba(0, 0, 0, .25), inset 0 3px 0 var(--hot); }
.sheet.enter { animation: sheetin .32s cubic-bezier(.2, 1.15, .3, 1) both; }
@keyframes sheetin { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 10px 16px 8px; }
.sheet-head h2 { font: 900 24px/1.05 var(--f-display); letter-spacing: .04em; text-transform: uppercase; flex: 1; min-width: 0; }
.sheet-head .x { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--sheet-line); background: transparent; font-size: 22px; line-height: 1; color: var(--ink); }
.sheet-body { overflow-y: auto; padding: 6px 16px 14px; display: grid; gap: 14px; }
.sheet-foot { padding: 12px 16px 14px; border-top: 1px solid var(--sheet-line); display: grid; gap: 8px; }
@media (min-width: 680px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(620px, 92vw); max-height: 86vh; transform: translate(-50%, -50%); border-radius: 20px; }
  .sheet::before { display: none; }
  .sheet.enter { animation: pop .24s ease both; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -46%) scale(.97); } to { opacity: 1; transform: translate(-50%, -50%); } }
}
.card-detail { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; }
.detail-card { animation: detailin .45s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes detailin { from { transform: perspective(600px) rotateY(-70deg) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.card-detail .desc { display: grid; gap: 8px; }
.card-detail .desc p { color: var(--ink-soft); }
.card-detail .desc p.strong { color: var(--ink); font-size: 16px; }
.opts { display: grid; gap: 8px; }
.opt-note { font-size: 13px; color: var(--ink-soft); }
.colorgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.colorbtn { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; border-radius: 12px; border: 1px solid var(--sheet-line); background: var(--hall); color: var(--ink); text-align: left; transition: transform .12s ease; }
.colorbtn:active { transform: scale(.97); }
.colorbtn i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--pc); color: var(--pt); flex: none; }
.colorbtn i svg { width: 18px; height: 18px; }
.colorbtn b { font: 800 15px/1 var(--f-label); letter-spacing: .04em; text-transform: uppercase; display: block; }
.colorbtn small { color: var(--ink-soft); font-size: 12px; display: block; margin-top: 3px; }
.colorbtn.on { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.section-label { font: 800 13px/1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.picks.spread { gap: 10px; }
.pick { position: relative; padding: 0; border: 0; background: none; border-radius: 9px; }
.pick .card { transition: transform .15s cubic-bezier(.3, 1.5, .5, 1), box-shadow .15s ease; }
.pick.on .card { transform: translateY(-5px); box-shadow: 0 0 0 3px var(--accent), var(--shadow-lift); }
.pick.on::after { content: "\2713"; position: absolute; bottom: -6px; left: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 900 14px/22px var(--f-body); text-align: center; animation: tagpop .3s cubic-bezier(.3, 1.6, .5, 1) both; }
.pick:disabled .card { opacity: .45; }
.pick-pile { padding: 0; border: 0; background: none; border-radius: 10px; }
.pick-pile.on .pile { box-shadow: 0 0 0 3px var(--accent), var(--shadow-lift); }
.deal-in { display: inline-block; animation: dealin .4s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes dealin { from { transform: translateY(24px) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
.group { display: grid; gap: 8px; }
.group h3 { font: 800 16px/1 var(--f-label); letter-spacing: .06em; text-transform: uppercase; }
.paybar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.paybar .sum { font: 900 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.paybar .sum small { font: 700 14px var(--f-label); color: var(--ink-soft); letter-spacing: .06em; }
.paybar .hint { flex: 1 1 160px; font-size: 13px; color: var(--ink-soft); }
.paybar .hint.ok { color: var(--ink); }
.meter { height: 6px; border-radius: 3px; background: var(--hall-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--hot); border-radius: 3px; transition: width .3s cubic-bezier(.3, 1.3, .5, 1), background .2s ease; }
.meter.ok i { background: #1E9455; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--sheet-line); background: var(--hall); color: var(--ink); text-align: left; }
.toggle.on { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.toggle .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--ink-soft); display: grid; place-items: center; flex: none; }
.toggle.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.loglist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.loglist li { padding: 7px 0; border-top: 1px solid var(--sheet-line); font-size: 14px; }
.loglist li:first-child { border-top: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 5px; background: var(--pc); color: var(--pt); font: 800 13px/1.35 var(--f-label); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.chip.plain { background: var(--zone); color: var(--ink); }
.rules h3 { font: 800 17px/1.1 var(--f-label); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.rules p, .rules li { color: var(--ink); max-width: 65ch; }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
.kv b { font: 800 15px/1.2 var(--f-label); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }

/* ---------- overlays ---------- */
#over-root { position: relative; z-index: 33; }
.curtain, .overlay { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.curtain { background: radial-gradient(circle at 50% 30%, #1A2530, var(--board) 70%); color: var(--board-ink); animation: fade .35s ease both; }
.curtain-inner, .win-card { width: min(480px, 100%); display: grid; gap: 18px; text-align: center; padding-block: 24px; }
.pass { position: relative; background: #F8F4EA; color: #17222C; border-radius: 18px; overflow: hidden; text-align: left; box-shadow: 0 30px 60px rgba(0, 0, 0, .45); animation: passin .6s cubic-bezier(.2, 1.2, .3, 1) both; }
@keyframes passin { from { transform: translateY(40px) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }
.pass::before, .pass::after { content: ""; position: absolute; top: 62%; width: 22px; height: 22px; border-radius: 50%; background: #121B22; }
.pass::before { left: -11px; } .pass::after { right: -11px; }
.pass-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--board); color: var(--board-ink); font: 800 13px/1 var(--f-label); letter-spacing: .16em; text-transform: uppercase; }
.pass-top span { display: inline-flex; align-items: center; gap: 6px; }
.pass-top svg { width: 15px; height: 15px; transform: rotate(45deg); }
.pass-main { padding: 18px 16px 10px; display: grid; gap: 10px; text-align: center; }
.pass .eyebrow { font: 800 13px/1 var(--f-label); letter-spacing: .2em; text-transform: uppercase; color: #6B5A33; }
.pass .flaps { font-size: clamp(30px, 10vw, 52px); }
.curtain-why { color: #3C4A55; font-size: 16px; }
.pass-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 16px; border-top: 2px dashed #CFC6B2; }
.pass-row span { display: grid; gap: 3px; }
.pass-row small { font: 700 11px/1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: #7A6A48; }
.pass-row b { font: 900 20px/1 var(--f-display); letter-spacing: .04em; }
.barcode { height: 40px; margin: 0 16px 14px; background: repeating-linear-gradient(90deg, #17222C 0 2px, transparent 2px 4px, #17222C 4px 5px, transparent 5px 8px, #17222C 8px 11px, transparent 11px 12px); opacity: .85; border-radius: 2px; }
.recent { text-align: left; background: rgba(255, 255, 255, .05); border-radius: 14px; padding: 12px 14px; color: #E9EEF2; }
.recent h3 { font: 800 13px/1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--board-ink-2); margin-bottom: 6px; }
.recent ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.recent li { animation: rise .4s ease both; }
.recent .chip.plain { background: rgba(255, 255, 255, .12); color: #F4F6F8; }
.overlay { background: var(--scrim); animation: fade .3s ease both; }
.win-card { background: radial-gradient(circle at 50% 0%, #22303B, var(--board) 65%); color: var(--board-ink); border-radius: 22px; padding: 22px 16px; box-shadow: 0 30px 70px rgba(0, 0, 0, .5); animation: passin .6s cubic-bezier(.2, 1.2, .3, 1) both; }
.win-card .eyebrow { font: 800 14px/1 var(--f-label); letter-spacing: .2em; text-transform: uppercase; color: var(--board-ink-2); }
.win-card .flaps { font-size: clamp(28px, 9vw, 50px); }
.win-card p { color: #F1E2C0; }
.win-sets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.win-set { animation: winset .6s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes winset { from { transform: translateY(30px) rotate(-8deg) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.replay-bar { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 36; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 999px; background: var(--board); color: var(--board-ink); font: 800 13px/1 var(--f-label); letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); white-space: nowrap; animation: qbin .25s ease both; }
.replay-bar .btn { min-height: 34px; padding: 0 14px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.react-tray { position: absolute; right: 48px; top: 46px; z-index: 20; display: flex; gap: 4px; padding: 6px; border-radius: 16px; background: var(--sheet); border: 1px solid var(--sheet-line); box-shadow: var(--shadow-lift); animation: qbin .2s ease both; }
.react-tray button { width: 42px; height: 42px; border: 0; border-radius: 12px; background: transparent; font-size: 26px; line-height: 1; transition: transform .12s ease; }
.react-tray button:hover, .react-tray button:focus-visible { transform: scale(1.2); background: var(--hall); }

/* ---------- toasts ---------- */
#toasts { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; display: grid; gap: 8px; width: min(440px, calc(100vw - 32px)); }
#toasts, .toast { pointer-events: none; }
.toast { background: var(--board); color: #EEF2F5; border-radius: 12px; padding: 10px 14px; font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); animation: toastin .3s cubic-bezier(.2, 1.3, .4, 1) both; border-left: 4px solid var(--board-ink); }
.toast.warn { border-left-color: #FF6B5E; }
.toast .chip.plain { background: rgba(255, 255, 255, .12); color: #F4F6F8; }
.toast.out { animation: toastout .3s ease both; }
@keyframes toastin { from { opacity: 0; transform: translateY(-14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastout { to { opacity: 0; transform: translateY(-10px); } }

@media (min-width: 720px) {
  .pile { width: 98px; }
  .flap { min-height: 84px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  #sky .jet { display: none; }
}

.share { border-color: var(--accent); }
.share-url { font: 600 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-all; background: var(--hall); color: var(--ink); padding: 10px 12px; border-radius: 10px; user-select: all; -webkit-user-select: all; }
.share-code { font: 900 34px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); user-select: all; -webkit-user-select: all; }

/* ---------- computer and tablet layout ---------- */
.dock-tip { font: 700 12px/1 var(--f-label); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); opacity: .8; }
.rivals.cols { grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); align-items: stretch; }
.rivals.cols-2 { --cols: 2; }
.rivals.cols-3 { --cols: 3; }
.rivals.cols .zone .pname { max-width: 10ch; }
.wrap.wide { max-width: 1240px; }
.game.desk { gap: 12px; }
.game.desk .rivals { gap: 12px; }
.game.desk .rivals .zone { align-content: start; }
.game.desk .strip { width: min(100%, 900px); margin-inline: auto; }
.game.desk .deck, .game.desk .discardslot { width: 62px; height: 87px; }
.game.desk .pile { width: 100px; }
html.desk .dock > * { max-width: 1208px; }
html.desk .dock-bar { justify-content: center; gap: 16px; }
html.desk .dock-bar .spacer { display: none; }
html.desk .dock-bar .btn { min-width: 170px; }
html.desk .hand-card:hover { transform: translateX(calc(-50% + var(--fx))) translateY(calc(var(--fy) - 22px)) rotate(var(--fr)); }
html.desk .hand-card.sel { transform: translateX(calc(-50% + var(--fx))) translateY(calc(var(--fy) - 40px)) rotate(0deg) scale(1.06); }
html.desk #toasts { left: auto; right: 20px; transform: none; top: 76px; width: 360px; }
html.desk .hand-card { bottom: 24px; }
.rivals.cols-3 .zone-head { gap: 6px; }
@media (max-width: 1100px) {
  .rivals.cols-3 .avatar { width: 26px; height: 26px; font-size: 13px; }
  .rivals.cols-3 .pname { font-size: 15px; max-width: 8ch; }
  .rivals.cols-3 .pill { height: 26px; padding: 0 7px; font-size: 13px; gap: 4px; }
  .rivals.cols-3 .setpips i { width: 8px; height: 8px; }
}
.paygroups { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: flex-start; }
.paygroups > .group { min-width: 0; }

</style>

<script>
/* Standalone build: stands in for Claude's shared storage with a public MQTT relay.
   The table lives on a topic named by a random code carried in the page link (#t-<code>-b<relay>). */
(function () {
  'use strict';
  const RELAYS = window.JETSET_BROKERS || [
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://broker.emqx.io:8084/mqtt',
    'wss://test.mosquitto.org:8081/mqtt',
  ];
  const ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';
  const rnd = n => { let s = ''; for (let i = 0; i < n; i++) s += ALPHA[Math.floor(Math.random() * ALPHA.length)]; return s; };
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } };

  function fromHash() {
    const m = /^#t-([a-z0-9]{6,16})(?:-b(\d))?$/.exec(location.hash || '');
    return m ? { code: m[1], relay: m[2] != null ? +m[2] : null } : null;
  }
  let table = fromHash();
  window.JETSET_STANDALONE = true;
  window.JETSET_AUTO_ONLINE = !!table;

  let viewerId = lsGet('jetset:sid');
  if (!viewerId) { viewerId = 'u_' + rnd(16); lsSet('jetset:sid', viewerId); }
  const tabTag = rnd(10);
  let client = null, relay = null, connecting = null;
  const handlers = new Map();

  function tryRelay(i) {
    return new Promise((resolve, reject) => {
      const c = window.mqtt.connect(RELAYS[i], { clientId: 'jetset_' + rnd(12), clean: true, connectTimeout: 6000, reconnectPeriod: 2000, keepalive: 30 });
      let settled = false;
      const timer = setTimeout(() => { if (!settled) { settled = true; c.end(true); reject(new Error('timeout')); } }, 7000);
      c.once('connect', () => { if (settled) return; settled = true; clearTimeout(timer); resolve(c); });
      c.once('error', () => { if (settled) return; settled = true; clearTimeout(timer); c.end(true); reject(new Error('error')); });
    });
  }
  function link() { return location.origin + location.pathname + '#t-' + table.code + '-b' + relay; }
  function ensure() {
    if (client) return Promise.resolve(client);
    if (connecting) return connecting;
    connecting = (async () => {
      if (!table) {
        const last = lsGet('jetset:table');
        table = last ? JSON.parse(last) : { code: rnd(8), relay: null };
      }
      const order = table.relay != null ? [table.relay] : RELAYS.map((_, i) => i);
      for (const i of order) {
        try { client = await tryRelay(i); relay = i; break; } catch (e) { /* next relay */ }
      }
      if (!client) { connecting = null; throw new Error('No relay reachable'); }
      table.relay = relay;
      lsSet('jetset:table', JSON.stringify(table));
      try { history.replaceState(null, '', '#t-' + table.code + '-b' + relay); } catch (e) { location.hash = 't-' + table.code + '-b' + relay; }
      client.on('message', (topic, payload) => { const set = handlers.get(topic); if (set) set.forEach(fn => fn(payload)); });
      return client;
    })();
    return connecting;
  }
  const topic = path => 'jetset/v1/' + table.code + '/' + path;
  function listen(t, fn, qos) {
    if (!handlers.has(t)) { handlers.set(t, new Set()); client.subscribe(t, { qos }); }
    handlers.get(t).add(fn);
    return () => { const s = handlers.get(t); if (s) s.delete(fn); };
  }
  const snap = (path, d) => ({ exists: d != null, id: path.split('/').pop(), data: () => d, metadata: { fromCache: false, hasPendingWrites: false } });

  const db = {
    doc(path) {
      return {
        path, id: path.split('/').pop(),
        set(data) {
          return ensure().then(c => new Promise((res, rej) => c.publish(topic(path), JSON.stringify(data), { qos: 1, retain: true }, err => (err ? rej({ code: 'unavailable', message: String(err) }) : res()))));
        },
        onSnapshot(next, onErr) {
          let dead = false, heard = false, off = null;
          ensure().then(() => {
            if (dead) return;
            off = listen(topic(path), payload => {
              if (dead) return;
              let d = null;
              try { d = payload && payload.length ? JSON.parse(payload.toString()) : null; } catch (e) { return; }
              heard = true;
              next(snap(path, d));
            }, 1);
            // An empty table has no retained message: report "nothing here" so the lobby can open.
            setTimeout(() => { if (!dead && !heard) next(snap(path, null)); }, 1500);
          }, () => { if (!dead && onErr) onErr({ code: 'unavailable', message: 'The game relay could not be reached.' }); });
          return () => { dead = true; if (off) off(); };
        },
      };
    },
  };
  const user = { id: async () => viewerId, can: async () => true, isOwner: async () => false, canEdit: async () => true };
  const rooms = {
    async join(name) {
      const c = await ensure();
      const base = topic('room/' + name + '/');
      return {
        name,
        emit(t, data) { return new Promise(res => c.publish(base + t, JSON.stringify({ from: tabTag, data }), { qos: 0 }, () => res())); },
        on(t, fn) {
          return listen(base + t, payload => {
            let m;
            try { m = JSON.parse(payload.toString()); } catch (e) { return; }
            fn({ topic: t, data: m.data, isMe: m.from === tabTag, sameTab: m.from === tabTag, peer: m.from, by: null, kind: 'viewer', guest: false });
          }, 0);
        },
        leave() { return Promise.resolve(); },
        presence() { return Promise.resolve(); },
        onPeers() { return () => {}; },
        peers() { return []; },
        connected() { return c.connected; },
      };
    },
  };
  window.claude = {
    use(name) {
      if (name === 'user') return Promise.resolve(user);
      if (name === 'db' || name === 'room') return ensure().then(() => (name === 'db' ? db : rooms), () => null);
      return Promise.resolve(null);
    },
  };
  window.jetsetShare = () => (client && table ? { url: link(), code: table.code + '-' + relay, local: location.protocol === 'file:' } : null);
  /* Join a friend's table from a typed code ("3fs76tq7-b1", "3fs76tq7-1") or a pasted link. */
  window.jetsetJoinCode = raw => {
    const m = /([a-z0-9]{6,16})-b?(\d)\s*$/i.exec(String(raw || '').trim());
    if (!m) return false;
    const t = { code: m[1].toLowerCase(), relay: +m[2] };
    lsSet('jetset:table', JSON.stringify(t));
    location.hash = 't-' + t.code + '-b' + t.relay;
    location.reload();
    return true;
  };
})();

</script>

    lblue:  { region: 'Greece',  size: 3, rent: [1, 2, 3],    value: 1, cities: ['Athens', 'Mykonos', 'Santorini'] },
    pink:   { region: 'Japan',   size: 3, rent: [1, 2, 4],    value: 2, cities: ['Tokyo', 'Kyoto', 'Osaka'] },

    red:    { region: 'Italy',   size: 3, rent: [2, 3, 6],    value: 3, cities: ['Rome', 'Florence', 'Venice'] },

    green:  { region: 'Lebanon', size: 3, rent: [2, 4, 7],    value: 4, cities: ['Beirut', 'Byblos', 'Baalbek'] },
    dblue:  { region: 'Icons',   size: 2, rent: [3, 8],       value: 4, cities: ['Paris', 'New York'] },
    rail:   { region: 'Railway', size: 4, rent: [1, 2, 3, 4], value: 2, cities: ['Orient Express', 'Trans-Siberian', 'Shinkansen', 'Glacier Express'] },
    util:   { region: 'Ports',   size: 2, rent: [1, 2],       value: 2, cities: ['Airport', 'Seaport'] },
  };
  const NO_BUILD = { rail: true, util: true };

  const ACTIONS = {
    dealbreaker: { name: 'Deal Breaker', v: 5, n: 2, text: 'Take a full set from another player, with any house or hotel on it.' },
    jsn:         { name: 'Just Say No', v: 4, n: 3, text: 'Cancel an action played against you, even on someone else’s turn. It can cancel another Just Say No.' },
    sly:         { name: 'Sly Deal', v: 3, n: 3, text: 'Take one property from another player. It can’t be part of a full set.' },
    forced:      { name: 'Forced Deal', v: 3, n: 3, text: 'Swap one of your properties for one of theirs. Neither can be part of a full set.' },
    debt:        { name: 'Debt Collector', v: 3, n: 3, text: 'One player of your choice pays you $5M.' },
    birthday:    { name: 'It’s My Birthday', v: 2, n: 3, text: 'Every other player pays you $2M.' },
    passgo:      { name: 'Pass Go', v: 1, n: 10, text: 'Draw 2 extra cards.' },
    house:       { name: 'House', v: 3, n: 3, text: 'Build on a full set to add $3M to its rent. Not on Railway or Ports.' },
    hotel:       { name: 'Hotel', v: 4, n: 2, text: 'Build on a full set that already has a house to add $4M more. Not on Railway or Ports.' },
    double:      { name: 'Double the Rent', v: 1, n: 2, text: 'Play it together with a Rent card to double the rent. It counts as one of your 3 plays.' },
  };

  const CARDS = [];
  (function build() {
    const add = (o, n) => { for (let i = 0; i < n; i++) CARDS.push(Object.assign({ id: CARDS.length }, o)); };
    [[1, 6], [2, 5], [3, 3], [4, 3], [5, 2], [10, 1]].forEach(([v, n]) => add({ t: 'money', v }, n));
    COLOR_ORDER.forEach(c => COLORS[c].cities.forEach(name => add({ t: 'prop', c, v: COLORS[c].value, name }, 1)));
    [[['dblue', 'green'], 4, 1], [['green', 'rail'], 4, 1], [['lblue', 'rail'], 4, 1], [['lblue', 'brown'], 1, 1],
     [['pink', 'orange'], 2, 2], [['red', 'yellow'], 3, 2], [['rail', 'util'], 2, 1], ['any', 0, 2]]
      .forEach(([cs, v, n]) => add({ t: 'wild', cs, v }, n));
    [[['dblue', 'green'], 1, 2], [['red', 'yellow'], 1, 2], [['pink', 'orange'], 1, 2], [['lblue', 'brown'], 1, 2],
     [['rail', 'util'], 1, 2], ['any', 3, 3]]
      .forEach(([cs, v, n]) => add({ t: 'rent', cs, v }, n));
    Object.keys(ACTIONS).forEach(a => add({ t: 'action', a, v: ACTIONS[a].v }, ACTIONS[a].n));
  })();

  let rng = Math.random;
  function setRng(f) { rng = f || Math.random; }

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function fail(msg) { const e = new Error(msg); e.game = true; throw e; }

  /* ---------- queries ---------- */

  function isFull(s) { return s.cards.length >= COLORS[s.c].size; }
  function fullCount(pl) {
    const cols = {};
    pl.sets.forEach(s => { if (isFull(s)) cols[s.c] = 1; });
    return Object.keys(cols).length;
  }
  function canBe(card, col) {
    if (!card || !COLORS[col]) return false;
    if (card.t === 'prop') return card.c === col;
    if (card.t === 'wild') return card.cs === 'any' || card.cs.indexOf(col) >= 0;
    return false;
  }
  function canBuild(s, kind) {
    if (!isFull(s) || NO_BUILD[s.c]) return false;
    return kind === 'house' ? s.house == null : (s.house != null && s.hotel == null);
  }
  function setRent(s) {
    const info = COLORS[s.c];
    const n = Math.min(s.cards.length, info.size);
    if (!n) return 0;
    let r = info.rent[n - 1];
    if (n === info.size) {
      if (s.house != null) r += 3;
      if (s.hotel != null) r += 4;
    }
    return r;
  }
  function rentFor(pl, col) {
    let best = 0;
    pl.sets.forEach(s => { if (s.c === col) best = Math.max(best, setRent(s)); });
    return best;
  }
  function findProp(pl, cid) {
    for (const s of pl.sets) {

    return null;
  }
  function others(st, p) {
    const n = st.players.length, out = [];

  }
  function isOpp(st, p, t) { return Number.isInteger(t) && t >= 0 && t < st.players.length && t !== p; }
  function hasJSN(st, p) { return st.players[p].hand.some(c => CARDS[c].a === 'jsn'); }
  function actor(st) {
    if (!st || st.phase === 'over') return -1;
    if (st.phase === 'respond') return st.pending.responder;
    return st.turn;
  }

  /* Everything a player can hand over when they owe money: bank cards and properties
     with a cash value. Full sets are safe (house rule): their cards and buildings never
     count, so rent can't break a set. Cards in hand never count either. */
  function payable(pl) {
    const out = [];
    pl.bank.forEach(c => out.push({ c, v: CARDS[c].v, w: 'bank' }));
    pl.sets.forEach(s => {
      if (isFull(s)) return;
      s.cards.forEach(c => { if (CARDS[c].v > 0) out.push({ c, v: CARDS[c].v, w: 'prop', set: s.id }); });
    });
    return out;
  }
  function total(pl) { return payable(pl).reduce((s, a) => s + a.v, 0); }

  /* A payment must cover the debt with no card to spare, or be everything you own. */
  function validPayment(pl, cids, amt) {
    const assets = payable(pl);
    const byId = {};
    assets.forEach(a => { byId[a.c] = a; });
    if (new Set(cids).size !== cids.length) return false;
    let sum = 0, min = Infinity;
    for (const c of cids) {
      const a = byId[c];
      if (!a) return false;
      sum += a.v; min = Math.min(min, a.v);
    }
    const all = assets.reduce((s, a) => s + a.v, 0);
    if (all <= amt) return cids.length === assets.length;
    return sum >= amt && sum - min < amt;
  }

  /* Cheapest way to pay: money first, then properties. */
  function suggestPayment(pl, amt) {
    const assets = payable(pl);
    const all = assets.reduce((s, a) => s + a.v, 0);
    if (all <= amt) return assets.map(a => a.c);
    const pain = a => a.w === 'bank' ? a.v * 10 : a.v * 10 + 30;
    const cap = amt + 10, INF = 1e9, n = assets.length;
    const dp = [];
    for (let i = 0; i <= n; i++) dp.push(new Array(cap + 1).fill(INF));
    dp[0][0] = 0;
    for (let i = 0; i < n; i++) {
      const v = assets[i].v, w = pain(assets[i]);
      for (let s = 0; s <= cap; s++) {
        if (dp[i][s] === INF) continue;
        if (dp[i][s] < dp[i + 1][s]) dp[i + 1][s] = dp[i][s];
        const ns = Math.min(cap, s + v);
        if (dp[i][s] + w < dp[i + 1][ns]) dp[i + 1][ns] = dp[i][s] + w;
      }
    }
    let best = -1;
    for (let s = amt; s <= cap; s++) if (dp[n][s] < INF && (best < 0 || dp[n][s] < dp[n][best])) best = s;
    if (best < 0) return [];
    const pick = [];
    let s = best;
    for (let i = n; i > 0; i--) {
      if (dp[i][s] === dp[i - 1][s]) continue;
      const v = assets[i - 1].v, w = pain(assets[i - 1]);
      let prev = -1;
      for (let q = 0; q <= cap; q++) {
        if (dp[i - 1][q] !== INF && Math.min(cap, q + v) === s && dp[i - 1][q] + w === dp[i][s]) { prev = q; break; }
      }
      if (prev < 0) return [];
      pick.push(assets[i - 1].c);
      s = prev;
    }
    return validPayment(pl, pick, amt) ? pick : [];
  }

  function rentChoices(st, p, cid) {
    const card = CARDS[cid], pl = st.players[p];
    const cols = card.cs === 'any' ? COLOR_ORDER : card.cs;
    return cols.map(col => ({ col, base: rentFor(pl, col) })).filter(x => x.base > 0);
  }
  function looseProps(st, p) {
    const out = [];
    st.players[p].sets.forEach(s => { if (!isFull(s)) s.cards.forEach(c => out.push({ c, col: s.c, set: s.id })); });
    return out;
  }
  function fullSets(st, p) { return st.players[p].sets.filter(isFull); }
  function buildChoices(st, p, kind) { return st.players[p].sets.filter(s => canBuild(s, kind)); }

  function cardName(cid) {
    const c = CARDS[cid];
    if (!c) return '?';
    if (c.t === 'money') return '$' + c.v + 'M';
    if (c.t === 'prop') return c.name;
    if (c.t === 'wild') return c.cs === 'any' ? 'Wild card (any color)' : 'Wild card (' + COLORS[c.cs[0]].region + ' / ' + COLORS[c.cs[1]].region + ')';
    if (c.t === 'rent') return c.cs === 'any' ? 'Wild Rent' : 'Rent (' + COLORS[c.cs[0]].region + ' / ' + COLORS[c.cs[1]].region + ')';
    return ACTIONS[c.a].name;
  }

  /* ---------- state changes ---------- */

  function addLog(st, e) {
    e.n = ++st.logN;
    st.log.push(e);
    if (st.log.length > 80) st.log.splice(0, st.log.length - 80);
  }
  function newSet(st, c, cards) { return { id: 's' + (st.sid++), c, cards, house: null, hotel: null }; }

  /* Keep every player's table tidy: one pile per set, full piles first, buildings
     only on full piles that allow them. Buildings that lose their set go to the bank. */
  function normalize(st, p) {
    const pl = st.players[p];
    const out = [];
    COLOR_ORDER.forEach(col => {
      const piles = pl.sets.filter(s => s.c === col);
      if (!piles.length) return;
      const size = COLORS[col].size;
      const ordered = piles.filter(s => s.cards.length >= size).concat(piles.filter(s => s.cards.length < size));
      const cards = [];
      ordered.forEach(s => cards.push.apply(cards, s.cards));
      const ids = ordered.map(s => s.id);
      const blds = ordered.filter(s => s.house != null || s.hotel != null).map(s => ({ house: s.house, hotel: s.hotel }));
      const mine = [];
      for (let i = 0, k = 0; i < cards.length; i += size, k++) {
        mine.push({ id: ids[k] || ('s' + (st.sid++)), c: col, cards: cards.slice(i, i + size), house: null, hotel: null });
      }
      blds.forEach(b => {
        const target = NO_BUILD[col] ? null : mine.find(s => s.cards.length === size && s.house == null);
        if (target && b.house != null) { target.house = b.house; target.hotel = b.hotel; }
        else {
          if (b.house != null) pl.bank.push(b.house);
          if (b.hotel != null) pl.bank.push(b.hotel);

      out.push.apply(out, mine);
    });

  }

  function addProp(st, p, cid, col) {
    st.players[p].sets.push(newSet(st, col, [cid]));

  }
  function extractProp(pl, cid) {
    const loc = findProp(pl, cid);
    if (!loc) return null;
    loc.set.cards.splice(loc.i, 1);
    return loc.set.c;
  }
  function fromHand(st, p, cid) {
    const h = st.players[p].hand;
    const i = h.indexOf(cid);

    h.splice(i, 1);
  }
  function needPlay(st, n) {
    if (st.phase !== 'play') fail(st.phase === 'draw' ? 'Draw your cards first.' : 'You can’t play a card right now.');
    if (st.plays + n > 3) fail(n > 1 ? 'Not enough plays left for that.' : 'You’ve used all 3 plays this turn.');
  }
  function needAction(cid, a) { if (!CARDS[cid] || CARDS[cid].a !== a) fail('Wrong card.'); }

  function drawCards(st, p, n) {
    let got = 0;

        st.deck = shuffle(st.discard);
        st.discard = [];
        addLog(st, { k: 'reshuffle' });

      st.players[p].hand.push(st.deck.pop());
      got++;

    return got;
  }

  function checkWin(st) {
    if (st.phase === 'over') return true;

        st.phase = 'over';
        st.pending = null;

  }

  function nextTurn(st) {

    st.phase = 'draw';
    st.plays = 0;
  }

  function transfer(st, a, b, cids) {
    const A = st.players[a], B = st.players[b];
    let sum = 0;
    cids.forEach(cid => {
      const v = CARDS[cid].v;
      const bi = A.bank.indexOf(cid);

      const col = extractProp(A, cid);
      if (col) { B.sets.push(newSet(st, col, [cid])); sum += v; return; }
      const s = A.sets.find(x => x.house === cid || x.hotel === cid);

      fail('That card isn’t yours to pay with.');

  /* An action only needs a response when it would change something for the target. */
  function affects(st, t) {

  }

  function startPending(st, o) {
    st.pending = {
      kind: o.kind, from: o.from, card: o.card,
      amt: o.amt == null ? null : o.amt,
      col: o.col || null,
      take: o.take == null ? null : o.take,
      give: o.give == null ? null : o.give,
      set: o.set || null,
      queue: o.targets.slice(),

  function advance(st) {

      const t = pd.queue[0];

  /* Carry out the action against target t. True when t still has to choose how to pay. */
  function proceed(st, t) {
    const pd = st.pending, from = pd.from;
    if (pd.amt != null) {

    } else if (pd.kind === 'sly') {

      if (col) {
        st.players[from].sets.push(newSet(st, col, [pd.take]));

      const c1 = extractProp(st.players[t], pd.take);

      if (c1) st.players[from].sets.push(newSet(st, c1, [pd.take]));
      if (c2) st.players[t].sets.push(newSet(st, c2, [pd.give]));
      normalize(st, t); normalize(st, from);
      addLog(st, { k: 'swapped', p: from, t, take: pd.take, give: pd.give });

      const T = st.players[t];
      const i = T.sets.findIndex(s => s.id === pd.set);
      if (i >= 0) {
        const s = T.sets.splice(i, 1)[0];
        const moved = s.cards.concat(s.house != null ? [s.house] : [], s.hotel != null ? [s.hotel] : []);
        st.players[from].sets.push(s);
        normalize(st, t); normalize(st, from);
        addLog(st, { k: 'tookset', p: from, t, col: s.c, cards: moved });

  }

  /* After the Just Say No back-and-forth: an odd number of them cancels the action for this target. */
  function settle(st) {
    const pd = st.pending;
    if (pd.jsn % 2) {
      addLog(st, { k: 'blocked', p: pd.cur, from: pd.from, kind: pd.kind });
      pd.queue.shift();
      advance(st);
    } else if (!proceed(st, pd.cur)) {
      advance(st);
    }
  }

  const MOVES = {
    draw(st, p) {
      if (st.phase !== 'draw') fail('You already drew this turn.');
      const n = drawCards(st, p, st.players[p].hand.length ? 2 : 5);
      st.phase = 'play';
      st.plays = 0;
      addLog(st, { k: 'draw', p, n });
    },
    bank(st, p, m) {
      needPlay(st, 1);
      const card = CARDS[m.c];
      if (!card || card.t === 'prop' || card.t === 'wild') fail('Properties can’t go in the bank.');
      fromHand(st, p, m.c);
      st.players[p].bank.push(m.c);
      st.plays++;
      addLog(st, { k: 'bank', p, c: m.c });
    },
    prop(st, p, m) {
      needPlay(st, 1);
      if (!canBe(CARDS[m.c], m.col)) fail('That card can’t go there.');
      fromHand(st, p, m.c);
      addProp(st, p, m.c, m.col);
      st.plays++;
      addLog(st, { k: 'prop', p, c: m.c, col: m.col });
      checkWin(st);
    },
    move(st, p, m) {
      if (st.phase !== 'play') fail('You can move wild cards only during your turn.');
      const pl = st.players[p];
      const loc = findProp(pl, m.c);
      if (!loc || CARDS[m.c].t !== 'wild') fail('Only your own wild cards can move.');
      if (!canBe(CARDS[m.c], m.col) || loc.set.c === m.col) fail('Pick a different color.');
      loc.set.cards.splice(loc.i, 1);
      addProp(st, p, m.c, m.col);
      addLog(st, { k: 'move', p, c: m.c, col: m.col });
      checkWin(st);
    },
    passgo(st, p, m) {
      needPlay(st, 1);
      needAction(m.c, 'passgo');
      fromHand(st, p, m.c);
      st.discard.push(m.c);
      st.plays++;
      const n = drawCards(st, p, 2);
      addLog(st, { k: 'passgo', p, n, card: m.c });
    },
    build(st, p, m) {
      needPlay(st, 1);
      const kind = CARDS[m.c] && CARDS[m.c].a;
      if (kind !== 'house' && kind !== 'hotel') fail('That isn’t a building.');
      const s = st.players[p].sets.find(x => x.id === m.set);
      if (!s || !canBuild(s, kind)) fail('You can’t build there.');
      fromHand(st, p, m.c);
      s[kind] = m.c;
      st.plays++;
      addLog(st, { k: 'build', p, c: m.c, col: s.c });
    },
    rent(st, p, m) {
      const dbl = m.dbl || [];
      needPlay(st, 1 + dbl.length);
      const card = CARDS[m.c];
      if (!card || card.t !== 'rent') fail('That isn’t a rent card.');
      if (card.cs !== 'any' && card.cs.indexOf(m.col) < 0) fail('This rent card doesn’t cover that color.');
      const base = rentFor(st.players[p], m.col);
      if (!base) fail('You need a property in that color to charge rent.');
      const hand = st.players[p].hand;
      if (new Set(dbl).size !== dbl.length) fail('Pick each Double the Rent once.');
      dbl.forEach(d => { if (!CARDS[d] || CARDS[d].a !== 'double' || hand.indexOf(d) < 0) fail('Pick a Double the Rent from your hand.'); });
      let targets;
      if (card.cs === 'any') {
        if (!isOpp(st, p, m.target)) fail('Pick who pays.');
        targets = [m.target];
      } else targets = others(st, p);
      fromHand(st, p, m.c);
      st.discard.push(m.c);
      dbl.forEach(d => { fromHand(st, p, d); st.discard.push(d); });
      st.plays += 1 + dbl.length;
      const amt = base * Math.pow(2, dbl.length);
      addLog(st, { k: 'rent', p, col: m.col, amt, dbl: dbl.length, t: targets, card: m.c, dbls: dbl.slice() });
      startPending(st, { kind: 'rent', from: p, amt, col: m.col, targets, card: m.c });
    },
    debt(st, p, m) {
      needPlay(st, 1);
      needAction(m.c, 'debt');
      if (!isOpp(st, p, m.target)) fail('Pick who pays.');
      fromHand(st, p, m.c);
      st.discard.push(m.c);
      st.plays++;
      addLog(st, { k: 'debt', p, t: m.target, card: m.c });
      startPending(st, { kind: 'debt', from: p, amt: 5, targets: [m.target], card: m.c });
    },
    birthday(st, p, m) {
      needPlay(st, 1);
      needAction(m.c, 'birthday');
      fromHand(st, p, m.c);

  const isWide = () => vwidth() >= 720;

  const handCardW = () => {

    if (isDesk()) return Math.max(100, Math.min(140, Math.round((h - 440) / 2.9)));

  /* Cards fan out on an arc; the spread shrinks with hand size so the outer corners stay on screen. */
  function fanPositions(n, width, cw, flat) {
    const out = [];
    if (!n) return out;
    // On a computer the cards lie almost flat, side by side, so every one is readable.
    const spread = n > 1 ? Math.min(flat ? 1.6 : 3.5, (flat ? 12 : 26) / (n - 1)) : 0;
    const over = cw * 1.61 * Math.sin((spread * (n - 1) / 2) * Math.PI / 180);
    const avail = Math.max(cw, width - 2 * over);
    const step = n > 1 ? Math.min(cw * (flat ? 1.08 : 0.74), (avail - cw) / (n - 1)) : 0;
    for (let i = 0; i < n; i++) {
      const k = i - (n - 1) / 2;
      out.push({ x: k * step, y: flat ? Math.min(6, Math.abs(k) * Math.abs(k) * 0.5) : Math.min(10, Math.pow(Math.abs(k), 1.5) * 1.8), r: k * spread });
    }
    return out;
  }
  function hintFor(st, v, cid) {
    const c = C[cid], pl = st.players[v];
    if (c.t === 'prop') return E.propGain(pl, c.c) >= 100 ? 'Completes ' + COLORS[c.c].region : '';
    if (c.t === 'wild') {
      const cols = c.cs === 'any' ? ORDER : c.cs;
      const hit = cols.find(col => E.propGain(pl, col) >= 100);
      return hit ? 'Completes ' + COLORS[hit].region : '';
    }
    if (c.t === 'rent') {
      const best = E.rentChoices(st, v, cid).reduce((m, x) => Math.max(m, x.base), 0);
      return best ? 'Rent ' + M(best) : '';

  }
  function quickActions(st, v, cid) {
    const c = C[cid], opps = E.others(st, v), one = opps.length === 1;
    const out = [];

    const sheet = (label, s, primary, disabled) => out.push({ label, o: { sheet: s }, primary, disabled });
    const bank = () => { if (c.t !== 'prop' && c.t !== 'wild') mv('Bank ' + M(c.v), { t: 'bank', c: cid }, c.t === 'money'); };

  function syncAutoSheet() {

    else if (s && ACTION_SHEETS[s.type] && !(on && canAct() && st.phase === 'play')) ui.sheet = null;
