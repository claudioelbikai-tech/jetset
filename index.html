          foot: `<div class="row">${optBtn('Just Say No', { mv: { t: 'jsn' } }, 'primary big no-btn')}${optBtn(target ? 'Accept' : 'Let it go', { mv: { t: 'accept' } }, 'big')}</div>`,
        };
      }
      const pl = st.players[v];
      const assets = E.payable(pl);
      const sel = s.sel;
      const sum = assets.filter(a => sel.indexOf(a.c) >= 0).reduce((a, x) => a + x.v, 0);
      const valid = E.validPayment(pl, sel, pd.amt);
      const pick = (cid, extra) => `<button class="pick ${sel.indexOf(cid) >= 0 ? 'on' : ''}" data-act="pick" data-cid="${cid}" ${extra || ''} aria-label="${esc(E.cardName(cid))}">${cardHTML(cid, 'mini')}</button>`;
      const bank = pl.bank.slice().sort((a, b) => C[b].v - C[a].v);

        const cards = set.cards.map(c => pick(c, C[c].v ? '' : 'disabled')).join('');

      }).join('');
      let hint;
      if (sum < pd.amt) hint = `Pick at least ${M(pd.amt)}. No change is given.`;
      else if (!valid) hint = 'That’s more than you need to give. Remove a card.';
      else hint = sum > pd.amt ? `You’ll overpay by ${M(sum - pd.amt)}: no change is given.` : 'Exactly right.';
      const pct = Math.min(100, Math.round((sum / pd.amt) * 100));
      return {
        title: `Pay ${from} ${M(pd.amt)}`, dismiss: false, cls: 'hot',
        body: `<p>${ask(st, pd)}</p>
          ${bank.length ? `<div class="group"><h3>Your bank</h3><div class="picks">${bank.map(c => pick(c)).join('')}</div></div>` : ''}
          ${loose.length ? `<div class="group"><h3>Your table</h3><div class="paygroups">${table}</div></div>` : ''}
          ${safe.length ? `<p class="note">${ICON.check} Your full set${safe.length > 1 ? 's are' : ' is'} safe (${safe.join(', ')}): full sets are never used to pay.</p>` : ''}
          <p class="note">Properties you hand over go to ${from}’s table. Cards in your hand can’t be used.</p>`,
        foot: `<div class="paybar"><span class="sum">${M(sum)} <small>of ${M(pd.amt)}</small></span><span class="hint ${valid ? 'ok' : ''}">${hint}</span></div>
          <div class="meter ${valid ? 'ok' : ''}"><i style="width:${pct}%"></i></div>
          <div class="row"><button class="btn" data-act="autopay">Pick for me</button>${optBtn(`Pay ${M(sum)}`, { mv: { t: 'pay', cards: sel } }, 'primary', !valid)}</div>`,
      };
    },
    discard(s) {
      const st = game(), v = viewer();
      const hand = sortHand(st.players[v].hand);
      const need = hand.length - 7;
      return {
        title: `Discard ${need}`, dismiss: false,
        body: `<p>You can keep 7 cards at the end of your turn. Pick ${need} to discard.</p><div class="picks">${hand.map(c => `<button class="pick ${s.sel.indexOf(c) >= 0 ? 'on' : ''}" data-act="pick" data-cid="${c}" aria-label="${esc(E.cardName(c))}">${cardHTML(c, 'mini')}</button>`).join('')}</div>`,
        foot: optBtn(s.sel.length === need ? `Discard ${need} and end turn` : `Pick ${need - s.sel.length > 0 ? need - s.sel.length + ' more' : need}`, { mv: { t: 'discard', cards: s.sel } }, 'primary big', s.sel.length !== need),

  function rulesHTML() {
    const acts = Object.keys(E.ACTIONS).map(a => `<b>${esc(E.ACTIONS[a].name)}</b><span>${esc(E.ACTIONS[a].text)} (${E.ACTIONS[a].n} in the deck)</span>`).join('');
    return `<div class="rules stack">
      <h3>Goal</h3><p>Be the first to collect three full property sets, each a different color.</p>
      <h3>Your turn</h3><ul><li>Draw 2 cards, or 5 if your hand is empty.</li><li>Play up to 3 cards: tap a card for its options, or drag it onto your table, your bank or the board.</li><li>End your turn. If you hold more than 7 cards, discard down to 7.</li></ul>
      <h3>Playing cards</h3><ul><li>Money goes into your bank.</li><li>Properties go on your table. Tap a set to see its cards and rent.</li><li>Wild properties count as either of their colors. On your turn, tap the set they’re in to move them for free.</li><li>Action and rent cards can be played for their effect or banked as money. A banked card is only money from then on.</li></ul>
      <h3>On a computer</h3><ul><li>Double-click a card in your hand to play it.</li><li>D or Space draws, E ends your turn, Esc closes a window.</li><li>The menu lets you turn off drawing automatically, or speed up the animations.</li></ul>
      <h3>Paying</h3><ul><li>You pay from your bank and your table, never from your hand.</li><li>No change is given.</li><li>If you can’t cover it, you hand over everything you can.</li><li>Full sets are safe: nobody can make you pay with them, so rent never breaks a set. Only a Deal Breaker can take one.</li><li>Properties you receive go on your table. Money goes to your bank.</li></ul>
      <h3>Rent</h3><ul><li>A two-color Rent card charges every other player for one of its colors. The Wild Rent card charges one player for any color.</li><li>Rent depends on how many cards of that color you have. A house adds $3M and a hotel $4M to a full set.</li><li>Play Double the Rent with a Rent card to double it. Each one counts as a play.</li></ul>
      <h3>Action cards</h3><div class="kv">${acts}</div>
      <h3>Destinations</h3>${departuresHTML()}
    </div>`;
  }

  /* ================= input ================= */
  function openSheet(s) { ui.sheet = s; renderSheet(); }
  function selectCard(cid) {
    ui.sel = ui.sel === cid ? null : cid;
    sound.play('tap');
    $$('#dock .hand-card').forEach(el => {
      const on = +el.dataset.hcard === ui.sel;
      el.classList.toggle('sel', on);
      el.style.zIndex = on ? 60 : el.dataset.z;
    });
    const old = $('#dock .quickbar');
    if (old) old.remove();
    const st = shown(), v = viewer();
    const fan = $('#dock .fan-hand');
    if (ui.sel != null && fan && st && v >= 0) fan.insertAdjacentHTML('beforebegin', quickbarHTML(st, v));
    setDockHeight();
  }
  function primaryFor(cid, zone) {
    const st = game(), v = viewer();
    const c = C[cid];
    if (zone === 'bank') return c.t === 'prop' || c.t === 'wild' ? null : { mv: { t: 'bank', c: cid } };
    if (zone === 'table') {
      if (c.t === 'money') return { mv: { t: 'bank', c: cid } };
      if (c.t === 'prop') return { mv: { t: 'prop', c: cid, col: c.c } };
      if (c.t === 'wild') {
        if (c.cs === 'any') return { sheet: { type: 'card', cid } };
        const best = c.cs.slice().sort((a, b) => E.propGain(st.players[v], b) - E.propGain(st.players[v], a))[0];
        return E.propGain(st.players[v], best) >= 100 ? { mv: { t: 'prop', c: cid, col: best } } : { sheet: { type: 'card', cid } };
      }
      return null;
    }
    if (zone === 'play') {
      if (c.t !== 'action' && c.t !== 'rent') return null;
      const q = quickActions(st, v, cid).find(a => a.primary && !a.disabled);
      return q ? q.o : null;
    }
    return null;
  }

  /* dragging a card out of the fan */
  const drag = { on: false, cid: null, id: null, x0: 0, y0: 0, ghost: null, zone: null, el: null, pads: null, suppress: 0 };
  function dropZonesFor(cid) {
    const c = C[cid];
    if (c.t === 'money') return ['bank', 'table'];
    if (c.t === 'prop' || c.t === 'wild') return ['table'];
    if (c.a === 'jsn' || c.a === 'double') return ['bank'];
    return ['play', 'bank'];
  }
  function startDrag(e) {
    const st = game();
    if (!canAct() || st.phase !== 'play' || st.plays >= 3 || anim.busy) return false;
    drag.on = true;
    const r = drag.el.getBoundingClientRect();
    const gh = document.createElement('div');
    gh.className = 'drag-ghost';
    gh.innerHTML = cardHTML(drag.cid, 'hand');
    gh.style.setProperty('--hand-cw', handCardW() + 'px');
    document.body.appendChild(gh);
    drag.ghost = gh;
    drag.offX = Math.min(r.width, Math.max(0, e.clientX - r.left));
    drag.offY = Math.min(r.height, Math.max(0, e.clientY - r.top));
    drag.el.classList.add('dragging');
    const zones = dropZonesFor(drag.cid);
    $$('#app [data-drop]').forEach(z => z.classList.toggle('drop-ok', zones.indexOf(z.dataset.drop) >= 0));
    const pads = document.createElement('div');
    pads.className = 'droppads';
    pads.innerHTML = ['bank', 'play', 'table'].map(z => `<div class="pad ${zones.indexOf(z) >= 0 ? 'ok' : 'no'}" data-drop="${z}">${z === 'bank' ? ICON.bank + '<span>Bank</span>' : z === 'play' ? '<span>Play action</span>' : '<span>Table</span>'}</div>`).join('');
    document.body.appendChild(pads);
    drag.pads = pads;
    sound.play('flip');
    if (ui.sel != null) selectCard(ui.sel);
    moveDrag(e);
    return true;
  }
  function moveDrag(e) {
    const x = e.clientX - drag.offX, y = e.clientY - drag.offY;
    const tilt = Math.max(-14, Math.min(14, (e.clientX - (drag.lastX == null ? e.clientX : drag.lastX)) * 1.5));
    drag.lastX = e.clientX;
    drag.ghost.style.transform = `translate(${x}px, ${y}px) rotate(${tilt}deg) scale(1.06)`;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const z = under && under.closest && under.closest('[data-drop]');
    const zone = z && dropZonesFor(drag.cid).indexOf(z.dataset.drop) >= 0 ? z.dataset.drop : null;
    if (zone !== drag.zone) {
      drag.zone = zone;
      $$('.drop-hover').forEach(n => n.classList.remove('drop-hover'));
      if (zone) { $$(`[data-drop="${zone}"]`).forEach(n => n.classList.add('drop-hover')); sound.play('tap'); }
    }
  }
  function endDrag() {
    const ghost = drag.ghost;
    const zone = drag.zone;
    const cid = drag.cid;
    const gr = ghost.getBoundingClientRect();
    $$('.drop-ok, .drop-hover').forEach(n => n.classList.remove('drop-ok', 'drop-hover'));
    if (drag.pads) drag.pads.remove();
    const o = zone ? primaryFor(cid, zone) : null;
    if (o && o.mv) {
      ui.dragGhost = { cid, rect: gr };
      ghost.remove();
      act(o.mv);
      ui.dragGhost = null;
    } else {
      const el = $(`#app [data-hcard="${cid}"]`) || $(`#dock [data-hcard="${cid}"]`);
      if (el) {
        const r = el.getBoundingClientRect();
        const a = ghost.animate([{ transform: ghost.style.transform }, { transform: `translate(${r.left}px, ${r.top}px) rotate(0deg) scale(1)` }], { duration: 260, easing: 'cubic-bezier(.3,1.3,.5,1)' });
        const done = () => { ghost.remove(); el.classList.remove('dragging'); };
        a.finished.then(done, done);
      } else ghost.remove();
      if (o && o.sheet) openSheet(o.sheet);
    }
    drag.on = false; drag.ghost = null; drag.pads = null; drag.zone = null; drag.lastX = null;
  }
  document.addEventListener('pointerdown', e => {
    sound.init();
    const card = e.target.closest && e.target.closest('.hand-card');
    if (!card || e.button > 0) return;
    drag.cid = +card.dataset.hcard; drag.id = e.pointerId; drag.x0 = e.clientX; drag.y0 = e.clientY; drag.el = card; drag.on = false; drag.lastX = null;
  });
  document.addEventListener('touchend', () => sound.init(), { passive: true });
  document.addEventListener('pointermove', e => {
    if (drag.cid == null || e.pointerId !== drag.id) return;
    if (!drag.on) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 10) return;
      if (!startDrag(e)) { drag.cid = null; return; }
    }
    e.preventDefault();
    moveDrag(e);
  }, { passive: false });
  document.addEventListener('pointerup', e => {
    if (drag.cid == null || e.pointerId !== drag.id) return;
    if (drag.on) { endDrag(); drag.suppress = Date.now(); }
    drag.cid = null;
  });
  document.addEventListener('pointercancel', e => {
    if (drag.cid == null || e.pointerId !== drag.id) return;
    if (drag.on) { drag.zone = null; endDrag(); }
    drag.cid = null;
  });

  const ACTS = {
    home() { anim.finish(); ui.screen = 'home'; ui.sheet = null; ui.replaying = false; clearTimeout(ui.botTimer); ui.botTimer = null; render(); },
    setup() { ui.screen = 'setup'; ui.sheet = null; render(); },

    'add-player'() { if (ui.setupNames.length < 4) { ui.setupNames.push(''); render(); const el = document.getElementById('setup-name-' + (ui.setupNames.length - 1)); if (el) el.focus(); } },
    'remove-player'(d) { ui.setupNames.splice(+d.i, 1); render(); },
    'start-local'() { newLocal(ui.setupNames.map((n, i) => cleanName(n) || 'Player ' + (i + 1)), false); },
    'start-bot'() { newLocal([cleanName(ui.youName) || 'You'].concat(BOT_NAMES.slice(0, ui.botN)), true); },

    'pick-seat'(d) { const doc = online.doc; if (!doc) return; remember(doc, +d.i, true); online.me = +d.i; online.watch = false; online.seenN = doc.game ? doc.game.logN : 0; ui.disp = game(); render(); },

    'share-link'() {

    'ask-quit'() { openSheet({ type: 'quit' }); },
    'ask-close'() { openSheet({ type: 'quit' }); },

    },
    opt(d) {

    'rent-col'(d) { ui.sheet.col = d.col; sound.play('tap'); renderSheet(); },

  document.addEventListener('click', e => {
    sound.init();
    const el = e.target.closest('[data-act]');
    if (ui.reactOpen && (!el || (el.dataset.act !== 'react' && el.dataset.act !== 'react-open'))) { ui.reactOpen = false; if (!el) { render(); return; } }
    if (!el || el.disabled) return;
    const h = ACTS[el.dataset.act];
    if (!h) return;
    e.preventDefault();
    h(el.dataset, el);
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (!el.dataset || !el.dataset.bind) return;
    if (el.dataset.bind === 'setup') ui.setupNames[+el.dataset.i] = el.value;
    else if (el.dataset.bind === 'online-name') online.nameDraft = el.value;
    else if (el.dataset.bind === 'you') ui.youName = el.value;
    else if (el.dataset.bind === 'join-code') online.codeDraft = el.value;
  });
  /* Double-click a card in your hand to do the obvious thing with it. */
  document.addEventListener('dblclick', e => {
    const card = e.target.closest && e.target.closest('.hand-card');
    if (!card) return;
    clearTimeout(ui.detailT);
    const st = game(), v = viewer(), cid = +card.dataset.hcard;
    if (!st || !canAct() || st.phase !== 'play' || st.plays >= 3) return;
    const a = quickActions(st, v, cid).find(x => x.primary && !x.disabled);
    if (!a) { openSheet({ type: 'card', cid }); return; }
    if (a.o.mv) act(a.o.mv); else if (a.o.sheet) openSheet(a.o.sheet);
  });
  /* Keyboard on a computer: D or Space draws, E ends the turn. */
  document.addEventListener('keydown', e => {
    const tag = e.target && e.target.tagName;
    if (!e.metaKey && !e.ctrlKey && !e.altKey && tag !== 'INPUT' && tag !== 'TEXTAREA' && !ui.sheet && onGameScreen()) {
      const k = (e.key || '').toLowerCase();
      const press = sel => { const b = $('#dock ' + sel); if (b && !b.disabled) { e.preventDefault(); b.click(); } };
      if (k === 'd' || (k === ' ' && (e.target === document.body || !tag))) press('[data-act="draw"]');
      else if (k === 'e') press('[data-act="end"]');
    }
    if (e.key === 'Escape') {
      if (ui.sheet && ['respond', 'discard'].indexOf(ui.sheet.type) < 0) { ui.sheet = null; renderSheet(); }
      else if (ui.sel != null) selectCard(ui.sel);
    }
    if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.bind) {
      const b = e.target.dataset.bind;
      if (b === 'setup') {
        const next = document.getElementById('setup-name-' + (+e.target.dataset.i + 1));
        if (next) next.focus(); else ACTS['start-local']();
      } else if (b === 'you') ACTS['start-bot']();
      else if (b === 'join-code') ACTS['join-code']();
      else if (b === 'online-name') {
        const d = online.doc;
        if (d && d.status === 'lobby' && online.me < 0) joinTable(); else if (!d || d.status === 'closed' || !d.seats || !d.seats.length) openTable();
      }
    }
  });
  let resizeT = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { if (onGameScreen() && !anim.busy && !drag.on) render(); }, 160);
  });
  window.addEventListener('pagehide', saveLocal);

  /* ================= boot ================= */
  function start(data) {
    data = data || {};
    if (data.setupNames) ui.setupNames = data.setupNames;
    if ((data.mode === 'local' || data.mode === 'bot') && data.local && data.local.st) {
      const L = data.local;
      ui.local = { st: L.st, viewer: L.viewer != null ? L.viewer : -1, seenStep: L.seenStep || [], seenN: L.seenN || [], bots: L.bots || (L.bot != null ? [L.bot] : []), hist: [L.st] };
      ui.mode = data.mode; ui.screen = 'game'; ui.disp = L.st;
    } else if (data.mode === 'online' || window.JETSET_AUTO_ONLINE) {
      ui.mode = 'online'; ui.screen = 'online';
    }
    render();
    if (ui.mode === 'online') connectOnline();
    scheduleBot();
    scheduleAutoDraw();
  }
  const hot = window.claude && window.claude.hot;
  try {
    if (hot && typeof hot.snapshot === 'function') {
      hot.snapshot(() => ({ mode: ui.mode, screen: ui.screen, local: ui.local ? { st: ui.local.st, viewer: ui.local.viewer, seenStep: ui.local.seenStep, seenN: ui.local.seenN, bots: ui.local.bots } : null, setupNames: ui.setupNames }));
    }
  } catch (e) { /* optional */ }
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();

</script>
</body>
</html>
